name: Verificar novedades de Zallatel en producción
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verificar-zallatel-feed.yml']
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Comprobar la selección publicada
        run: |
          node --input-type=module <<'JS' | tee zallatel-feed-probe.txt
          for (let i = 0; i < 12; i++) {
            try {
              const [blog, feed] = await Promise.all([
                fetch('https://antenaszalla.com/blog/?probe=' + Date.now(), {signal: AbortSignal.timeout(12000)}),
                fetch('https://antenaszalla.com/.netlify/functions/novedades-tdt?probe=' + Date.now(), {signal: AbortSignal.timeout(22000)})
              ]);
              const page = await blog.text();
              const {items = []} = await feed.json();
              const publishers = items.map(item => item.publisher || 'Mundoplus');
              console.log(i, blog.status, feed.status, feed.headers.get('X-Zallatel-RSS'), publishers);
              if (page.includes('https://www.uhdspain.com/noticias/') && publishers.includes('UHD Spain') && publishers.includes('SES / Astra TV')) {
                console.log(items.map(({publisher, label, date}) => ({publisher, label, date})));
                process.exit(0);
              }
            } catch (error) {
              console.log(i, error.message);
            }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          process.exit(1);
          JS

      - name: Guardar resultado temporal
        if: always()
        run: |
          git add zallatel-feed-probe.txt
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Registra la comprobación temporal de fuentes'
          git push origin HEAD:main
