# Producción Antenas Zalla: genera, prepara y audita el paquete indexable antes de publicar.
[build]
  command = "npm run build:production"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
  SITE_MODE = "preview"
[build.processing]
  skip_processing = true

# The blog function reads the final, audited page shell and retained-town links.
[functions.blog]
  included_files = ["dist/blog/index.html", "dist/assets/news-towns.json"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"
